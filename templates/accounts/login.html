{% extends 'base.html' %}

{% block title %}
Login | PackCheck AI
{% endblock %}


{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-logo">
            ⚖️
        </div>

        <h2>
            Welcome Back
        </h2>

        <p class="auth-subtitle">
            Login to PackCheck AI
        </p>


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>

            </div>


            <button
                type="submit"
                class="auth-button">

                Login

            </button>

        </form>


        <p class="auth-bottom">

            Don't have an account?

            <a href="/register/">
                Create Account
            </a>

        </p>

    </div>

</section>

{% endblock %}
