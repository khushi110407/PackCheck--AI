{% extends 'base.html' %}

{% block title %}
Profile | PackCheck AI
{% endblock %}


{% block content %}

<section class="page-section">

    <div class="container">

        <div class="page-header">

            <span>
                ACCOUNT
            </span>

            <h1>
                My Profile
            </h1>

            <p>
                Manage your PackCheck AI account.
            </p>

        </div>


        <div class="profile-card">

            <div class="profile-avatar">
                👤
            </div>


            <div class="profile-info">

                <h3>
                    User Profile
                </h3>

                <div class="profile-row">

                    <strong>
                        Name
                    </strong>

                    <span>
                        User Name
                    </span>

                </div>


                <div class="profile-row">

                    <strong>
                        Username
                    </strong>

                    <span>
                        username
                    </span>

                </div>


                <div class="profile-row">

                    <strong>
                        Email
                    </strong>

                    <span>
                        user@example.com
                    </span>

                </div>


                <div class="profile-row">

                    <strong>
                        Role
                    </strong>

                    <span class="status-badge">
                        Inspector
                    </span>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
